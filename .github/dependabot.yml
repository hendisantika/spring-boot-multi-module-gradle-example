version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    commit-message:
      prefix: "build"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "io.spring.gradle:dependency-management-plugin"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      gradle-plugins:
        patterns:
          - "org.gradle.toolchains.foojay-resolver-convention*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
